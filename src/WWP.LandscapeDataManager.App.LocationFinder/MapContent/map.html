<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var limMap = L.map('map').setView([39.8283, -98.5795], 4);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            referrerPolicy: 'strict-origin-when-cross-origin',
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(limMap);

        var limMarker = null;
        var limSaved = null;

        // The location already published to the project: fixed, labelled, so whoever opens the
        // tool sees it's set. The draggable pin is the new choice.
        function showSaved(lat, lng, label) {
            var target = [lat, lng];
            if (limSaved === null) {
                limSaved = L.circleMarker(target, { radius: 9, color: '#1b5e20', weight: 3, fillColor: '#43a047', fillOpacity: 0.9 })
                    .addTo(limMap)
                    .bindTooltip(label, { permanent: true, direction: 'top', offset: [0, -10] });
            } else {
                limSaved.setLatLng(target);
                limSaved.setTooltipContent(label);
            }

            limMap.setView(target, 15);
        }

        function postLatLng(lat, lng) {
            window.chrome.webview.postMessage(JSON.stringify({ lat: lat, lng: lng }));
        }

        function setMarker(lat, lng, zoom) {
            var target = [lat, lng];
            if (limMarker === null) {
                limMarker = L.marker(target, { draggable: true }).addTo(limMap);
                limMarker.on('dragend', function () {
                    var position = limMarker.getLatLng();
                    postLatLng(position.lat, position.lng);
                });
            } else {
                limMarker.setLatLng(target);
            }

            limMap.setView(target, zoom || Math.max(limMap.getZoom(), 12));
        }

        limMap.on('click', function (e) {
            setMarker(e.latlng.lat, e.latlng.lng);
            postLatLng(e.latlng.lat, e.latlng.lng);
        });
    </script>
</body>
</html>
